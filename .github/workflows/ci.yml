name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Typecheck · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Typecheck (frontend + server)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: reqflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/reqflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations to MySQL
        run: npx prisma migrate deploy
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        run: npm run test:e2e
